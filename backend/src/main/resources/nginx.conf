gzip on;
gzip_vary on;
gzip_min_length 1024;
gzip_comp_level 6;
gzip_types text/plain text/css text/xml application/json application/javascript
           application/xml+rss application/atom+xml image/svg+xml
           font/truetype font/opentype application/vnd.ms-fontobject;

sendfile on;
tcp_nopush on;
tcp_nodelay on;
keepalive_timeout 65;

server {
  listen 80;
  server_name _;
  root /opt/site/;
  index index.html;

  # Vite 构建产物均带内容哈希，整个 /assets/ 目录永久缓存
  location ^~ /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
    access_log off;
  }

  # 图片、字体等无哈希静态资源，缓存 30 天
  location ~* \.(png|jpg|jpeg|gif|ico|webp|svg|woff2?|ttf|eot)$ {
    expires 30d;
    add_header Cache-Control "public";
    access_log off;
  }

  location /ws-connect/ {
    proxy_pass http://127.0.0.1:8080;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_read_timeout 3600s;
  }

  location /files/ {
    alias /opt/site/uploads/;
    expires 30d;
    add_header Cache-Control "public";
  }

  location /api/ {
    proxy_pass http://127.0.0.1:8080;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  }

  location / {
    try_files $uri $uri/ /index.html;
    # index.html 不缓存，保证用户始终拿到最新版本
    add_header Cache-Control "no-cache";
  }
}